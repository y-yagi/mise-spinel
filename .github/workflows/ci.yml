name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      - name: Check formatting
        run: mise exec stylua@2.6.0 -- stylua --check .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        version: [latest, master]
    runs-on: ${{ matrix.os }}
    # master depends on the state of upstream; don't let it fail the build
    continue-on-error: ${{ matrix.version == 'master' }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      - name: Link plugin
        run: mise plugin link spinel .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install spinel
        run: mise install spinel@${{ matrix.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check spinel
        run: |
          mise exec spinel@${{ matrix.version }} -- spinel --version
          cd "$(mktemp -d)"
          mise exec spinel@${{ matrix.version }} -- spinel -e 'puts 42'
          test "$(./a)" = "42"
          mise exec spinel@${{ matrix.version }} -- spin new demo
          cd demo && mise exec spinel@${{ matrix.version }} -- spin run
